<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
  </defs>
  <!-- Outer hexagon -->
  <path d="M200 20 L353 110 L353 290 L200 380 L47 290 L47 110 Z" fill="url(#brandGrad)" opacity="0.08" stroke="url(#brandGrad)" stroke-width="3"/>
  <!-- Inner honeycomb pattern -->
  <path d="M200 60 L320 137 L320 263 L200 340 L80 263 L80 137 Z" fill="none" stroke="url(#brandGrad)" stroke-width="1.5" opacity="0.25"/>
  <!-- Center dot -->
  <circle cx="200" cy="200" r="12" fill="url(#brandGrad)"/>
  <!-- Orbiting dots -->
  <circle cx="200" cy="130" r="5" fill="url(#brandGrad)" opacity="0.6"/>
  <circle cx="270" cy="165" r="5" fill="url(#brandGrad)" opacity="0.6"/>
  <circle cx="270" cy="235" r="5" fill="url(#brandGrad)" opacity="0.6"/>
  <circle cx="200" cy="270" r="5" fill="url(#brandGrad)" opacity="0.6"/>
  <circle cx="130" cy="235" r="5" fill="url(#brandGrad)" opacity="0.6"/>
  <circle cx="130" cy="165" r="5" fill="url(#brandGrad)" opacity="0.6"/>
  <!-- Connecting lines (hexagonal node network) -->
  <line x1="200" y1="130" x2="270" y2="165" stroke="url(#brandGrad)" stroke-width="1" opacity="0.2"/>
  <line x1="270" y1="165" x2="270" y2="235" stroke="url(#brandGrad)" stroke-width="1" opacity="0.2"/>
  <line x1="270" y1="235" x2="200" y2="270" stroke="url(#brandGrad)" stroke-width="1" opacity="0.2"/>
  <line x1="200" y1="270" x2="130" y2="235" stroke="url(#brandGrad)" stroke-width="1" opacity="0.2"/>
  <line x1="130" y1="235" x2="130" y2="165" stroke="url(#brandGrad)" stroke-width="1" opacity="0.2"/>
  <line x1="130" y1="165" x2="200" y2="130" stroke="url(#brandGrad)" stroke-width="1" opacity="0.2"/>
  <!-- Central node connections -->
  <line x1="200" y1="200" x2="200" y2="130" stroke="url(#brandGrad)" stroke-width="1" opacity="0.15"/>
  <line x1="200" y1="200" x2="270" y2="165" stroke="url(#brandGrad)" stroke-width="1" opacity="0.15"/>
  <line x1="200" y1="200" x2="270" y2="235" stroke="url(#brandGrad)" stroke-width="1" opacity="0.15"/>
  <line x1="200" y1="200" x2="200" y2="270" stroke="url(#brandGrad)" stroke-width="1" opacity="0.15"/>
  <line x1="200" y1="200" x2="130" y2="235" stroke="url(#brandGrad)" stroke-width="1" opacity="0.15"/>
  <line x1="200" y1="200" x2="130" y2="165" stroke="url(#brandGrad)" stroke-width="1" opacity="0.15"/>
</svg>
